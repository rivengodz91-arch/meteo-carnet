name: meteo
on:
  schedule:
    - cron: "17 6,12,16 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  maj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python meteo.py
      - run: |
          git config user.name "meteo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add meteo.json
          git commit -m "meteo $(date -u +%F_%H%M)" || echo "rien de neuf"
          git push
