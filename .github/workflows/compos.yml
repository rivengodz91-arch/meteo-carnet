name: compos
on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:
concurrency:
  group: compos
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python compos.py
      - run: |
          git config user.name "compos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "compos $(date -u +%F_%H%M)" || echo "rien de neuf"
          git pull --rebase || true
          git push
