name: releves
on:
  schedule:
    - cron: "7 8,11,15,18,22 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  releve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python releves.py
        env:
          PIN_KEY: ${{ secrets.PIN_KEY }}
      - run: |
          git config user.name "releves-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git commit -m "releves $(date -u +%F_%H%M)" || echo "rien de neuf"
          git pull --rebase || true
          git push
